<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hello Canvas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f1a; color: #e8edf7;
      font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; left: 12px; top: 12px; font-size: 13px; opacity: 0.8; }
    button { position: fixed; right: 12px; top: 12px; padding: 8px 12px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(110,168,254,0.2); color: #e8edf7; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">Hello Canvas — a LumeOS web package</div>
  <button id="notify">Test LumeOS IPC</button>
  <script src="lume-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
