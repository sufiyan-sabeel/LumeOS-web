<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="description" content="LumeOS - a lightweight hybrid web-desktop operating system." />
  <title>LumeOS</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icon.svg" />

  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/desktop.css" />
  <link rel="stylesheet" href="/styles/apps.css" />
</head>
<body>
  <!-- Boot splash: shown until the kernel mounts the desktop -->
  <div id="lume-boot" class="boot">
    <div class="boot__logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="72" height="72">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6ea8fe"/>
            <stop offset="1" stop-color="#a06bff"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#lg)" opacity="0.18"/>
        <path d="M22 16v26h20v-6H29V16z" fill="url(#lg)"/>
      </svg>
    </div>
    <h1 class="boot__title">LumeOS</h1>
    <p class="boot__status" id="boot-status">Starting kernel…</p>
    <div class="boot__bar"><span id="boot-bar"></span></div>
  </div>

  <!-- Desktop shell (populated by the kernel) -->
  <div id="lume-desktop" class="desktop" hidden>
    <div id="wallpaper" class="wallpaper"></div>
    <main id="desktop-icons" class="icons" aria-label="Desktop shortcuts"></main>
    <section id="window-layer" class="window-layer" aria-label="Open windows"></section>
    <div id="start-menu" class="start-menu" hidden></div>
    <footer id="taskbar" class="taskbar" aria-label="Taskbar"></footer>
  </div>

  <div id="toast-layer" class="toast-layer" aria-live="polite"></div>

  <script type="module" src="/desktop/kernel.js"></script>
  <noscript>
    <p style="color:#fff;font-family:sans-serif;padding:2rem">
      LumeOS requires JavaScript and ES modules.
    </p>
  </noscript>
</body>
</html>
